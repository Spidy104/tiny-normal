[package]
name = "tiny-normal"
version = "0.6.0"
edition = "2024"
rust-version = "1.99"
description = "A small, fast Gaussian random number generator"
license = "MIT"
repository = "https://github.com/Spidy104/tiny-normal"
readme = "README.md"
keywords = ["random", "normal", "gaussian", "ziggurat", "simd"]
categories = ["algorithms", "mathematics", "simulation"]
include = [
    "src/**",
    "tests/**",
    "examples/bench.rs",
    "README.md",
    "LICENSE",
]

[[test]]
name = "memory"
harness = false

[profile.release]
codegen-units = 1
lto = "thin"
